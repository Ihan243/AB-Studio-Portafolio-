name: Generate desktop responsive thumbnail
on:
  push:
    branches: [fix/desktop-cls-2026-11-20]
    paths: [.github/workflows/perf-thumbnail.yml]
permissions:
  contents: write
jobs:
  thumbnail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-cls-2026-11-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.1.0
      - run: python scripts/optimize-floreria-preview.py
      - name: Commit optimized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/portfolio/floreria-muniz-480.webp
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "perf: add 480px thumbnail of Floreria Muniz"
            git push origin HEAD:fix/desktop-cls-2026-11-20
          fi
