name: AB Studio Phase 1 QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
