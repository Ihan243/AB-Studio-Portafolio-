name: Generate optimized brand images for mobile LCP
on:
  push:
    branches:
      - perf/mobile-lcp-2026-11-20
    paths:
      - .github/workflows/perf-optimize-assets.yml
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mobile-lcp-2026-11-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow==11.1.0
      - name: Resize and compress brand photos
        run: python scripts/optimize-brand-assets.py
      - name: Commit optimized assets to performance branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/brand/logo-96.webp public/assets/brand/abstudio-bamboo-entry-mobile.webp
          if git diff --cached --quiet; then
            echo "Assets already optimized"
          else
            git commit -m "perf: add small logo and portrait bamboo image"
            git push origin HEAD:perf/mobile-lcp-2026-11-20
          fi
